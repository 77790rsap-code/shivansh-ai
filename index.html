<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aditya Singh AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0b1329; color: #e2e8f0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { background: #1e293b; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .header-title h1 { font-size: 1.15rem; color: #38bdf8; font-weight: 700; }
    .header-title p { font-size: 0.72rem; color: #94a3b8; }
    .status-badge { background: #10b981; color: #fff; font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; font-weight: bold; }

    #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 82%; padding: 12px 16px; border-radius: 16px; line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; }
    .user { align-self: flex-end; background: #2563eb; color: #ffffff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-bottom-left-radius: 4px; }
    .bot-name { font-size: 0.75rem; color: #38bdf8; font-weight: bold; margin-bottom: 4px; }

    #input-bar { display: flex; gap: 8px; padding: 14px; background: #1e293b; border-top: 1px solid #334155; }
    input { flex: 1; padding: 12px 16px; background: #0f172a; border: 1px solid #475569; border-radius: 25px; color: #fff; font-size: 0.95rem; outline: none; }
    input:focus { border-color: #38bdf8; }
    button.send { background: #38bdf8; color: #0f172a; border: none; border-radius: 25px; padding: 0 20px; font-weight: bold; cursor: pointer; }

    footer { text-align: center; font-size: 0.7rem; color: #64748b; padding: 6px; background: #0b1329; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>Aditya Singh AI</h1>
      <p>Official Smart Assistant</p>
    </div>
    <span class="status-badge">● Online</span>
  </header>

  <div id="chat-box">
    <div class="msg bot">
      <div class="bot-name">Aditya Singh AI</div>
      नमस्ते! मैं <b>Aditya Singh AI</b> हूँ। आप मुझसे दुनिया का कोई भी सवाल, गणित, कोडिंग या पढ़ाई से जुड़ी बातें पूछ सकते हैं!
    </div>
  </div>

  <div id="input-bar">
    <input type="text" id="userInput" placeholder="Aditya Singh AI से कुछ भी पूछें..." onkeypress="if(event.key==='Enter') sendMsg()" />
    <button class="send" onclick="sendMsg()">भेजें</button>
  </div>

  <footer>Developed & Owned by Aditya Singh | All Rights Reserved © 2026</footer>

  <script>
    const API_KEY = "AQ.Ab8RN6IVb296AkaHqvU6h5R4YSF_EFkLrChFWlPDRm2nBP20Dw";

    async function sendMsg() {
      const input = document.getElementById("userInput");
      const box = document.getElementById("chat-box");
      const userText = input.value.trim();

      if (!userText) return;

      // 1. User Message
      const userMsgDiv = document.createElement("div");
      userMsgDiv.className = "msg user";
      userMsgDiv.innerText = userText;
      box.appendChild(userMsgDiv);
      input.value = "";
      box.scrollTop = box.scrollHeight;

      // 2. Loading State
      const botMsgDiv = document.createElement("div");
